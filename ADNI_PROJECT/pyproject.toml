[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "adni_project"
version = "0.0.1"
description = "MLOps pipeline and machine learning models for Alzheimer's disease diagnosis using ADNI dataset-"
authors = [
  { name = "Iberasa03" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["adni_project"]
force_sort_within_sections = true


